<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
        }
        .product-card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .product-img {
            width: 100%;
            border-radius: 10px;
        }
        .cart {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="product-card text-center">
            <img src="https://via.placeholder.com/400" class="product-img" alt="Product Image">
            <h2 class="mt-3">Product Name</h2>
            <p class="text-muted">$50.00</p>
            <input type="number" id="quantity" value="1" min="1" class="form-control w-50 mx-auto">
            <button class="btn btn-primary mt-3" id="addToCart">Add to Cart</button>
        </div>
        <div class="cart mt-4">
            <h4>Shopping Cart</h4>
            <ul id="cartItems" class="list-group"></ul>
            <p class="mt-3">Total: <strong id="totalPrice">$0.00</strong></p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#addToCart").click(function() {
                let quantity = parseInt($("#quantity").val());
                let price = 50.00;
                let total = quantity * price;
                $("#cartItems").append(`<li class='list-group-item'>Product Name x ${quantity} - $${total.toFixed(2)}</li>`);
                updateTotal();
            });
        });
        
        function updateTotal() {
            let total = 0;
            $("#cartItems li").each(function() {
                let text = $(this).text();
                let amount = parseFloat(text.split("-")[1].trim().substring(1));
                total += amount;
            });
            $("#totalPrice").text(`$${total.toFixed(2)}`);
        }
    </script>
</body>
</html>
